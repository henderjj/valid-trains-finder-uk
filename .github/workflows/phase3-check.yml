# Temporary Phase 3 check: plans journeys with changes on real data. Removed before merge.
name: Phase 3 check

on:
  push:
    branches: [phase-3-changes]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download feeds
        run: npm run data:download -- timetable fares
        env:
          NRDP_USERNAME: ${{ secrets.NRDP_USERNAME }}
          NRDP_PASSWORD: ${{ secrets.NRDP_PASSWORD }}
      - run: npm run data:build -- 2026-09-28 1
      - run: npm run -s data:check -- LGE SHF | sed -n '1,/^$/p;/^SVR/,/^$/p'
      - run: npm run -s data:check -- LGE LDS | sed -n '1,/^$/p;/^SVR/,/^$/p'
      - run: npm run -s data:check -- LGE MAN | sed -n '1,/^$/p;/^SVR/,/^$/p'
      - run: npm run -s data:check -- PNZ INV | sed -n '1,/^$/p' | head -3
      - run: npm run -s data:check -- KGX EDB | sed -n '1,/^$/p;/^SOS/,/^$/p' | head -50
