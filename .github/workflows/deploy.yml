# Builds the timetable data and the app together and publishes them to GitHub Pages,
# so the app and its data always match.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      days:
        description: Number of days of timetable to publish
        default: '28'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Download timetable and fares feeds
        run: npm run data:download -- timetable fares
        env:
          NRDP_USERNAME: ${{ secrets.NRDP_USERNAME }}
          NRDP_PASSWORD: ${{ secrets.NRDP_PASSWORD }}
      - name: Build timetable and fares data
        run: npm run data:build -- "" "${{ inputs.days || '28' }}"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
