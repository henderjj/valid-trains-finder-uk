# Temporary check: builds a week of real data and prints change times, platforms and
# ticket rules for a few routes.
name: Feed inspect

on:
  push:
    branches: [connection-times]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download feeds
        run: npm run data:download -- timetable fares routeing
        env:
          NRDP_USERNAME: ${{ secrets.NRDP_USERNAME }}
          NRDP_PASSWORD: ${{ secrets.NRDP_PASSWORD }}
      - run: npm run data:build -- 2026-09-28 7
      - run: bash pipeline/inspect-feeds.sh
