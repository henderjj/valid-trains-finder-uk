# Temporary spike: downloads the timetable and fares feeds and prints the parts needed for
# connection times, platforms and ticket rules.
name: Feed inspect

on:
  push:
    branches: [connection-times]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download timetable and fares feeds
        run: npm run data:download -- timetable fares
        env:
          NRDP_USERNAME: ${{ secrets.NRDP_USERNAME }}
          NRDP_PASSWORD: ${{ secrets.NRDP_PASSWORD }}
      - run: bash pipeline/inspect-feeds.sh
