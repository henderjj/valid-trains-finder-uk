# Temporary Phase 2 check: builds fares data from the live feeds and prints Long Eaton to
# Sheffield validity for a weekday. Removed before the Phase 2 pull request is merged.
name: Fares check

on:
  workflow_dispatch:
  push:
    branches: [phase-2-validity]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download feeds
        run: npm run data:download -- timetable fares
        env:
          NRDP_USERNAME: ${{ secrets.NRDP_USERNAME }}
          NRDP_PASSWORD: ${{ secrets.NRDP_PASSWORD }}
      - run: npm run data:build -- 2026-09-28 1
      - run: du -sh public/data/fares && ls public/data/fares | wc -l && ls -S -l public/data/fares | head -6 && ls -l public/data/*.json
      - run: npm run -s data:check -- LGE SHF
      - run: npm run -s data:check -- SHF LGE
      - run: npm run -s data:check -- KGX EDB 2>&1 | head -60
