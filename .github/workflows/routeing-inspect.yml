# Temporary check: builds routeing guide data and checks real journeys. Removed before merge.
name: Routeing check

on:
  push:
    branches: [routeing-guide]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download feeds
        run: npm run data:download -- timetable fares routeing
        env:
          NRDP_USERNAME: ${{ secrets.NRDP_USERNAME }}
          NRDP_PASSWORD: ${{ secrets.NRDP_PASSWORD }}
      - run: npm run data:build -- 2026-09-28 1
      - run: node -e "const d=require('./public/data/routeing.json'); console.log(d.london, d.nodes.length, Object.keys(d.fareRoutes).length, JSON.stringify(Object.entries(d.fareRoutes).slice(0,8)))"
      - run: node -e "const d=require('./public/data/routeing.json'); const r=require('./public/data/routeing/CHD.json'); const g=require('./public/data/routeing/G09.json'); console.log(d.stations.LGE, d.groups.LGE, d.stations.CHD, d.groups.NOT, d.groups.EMD, d.stations.EMD, JSON.stringify(r.G09), JSON.stringify(g.CHD), d.links['CHD-G43'], d.links['G09-G43'], d.links['CHD-G09'], d.distances.filter(x=>x.includes('LIV')||x.includes('TAM')||x.includes('BUT')).length)"
      - run: npm run -s data:check -- LGE MAN | sed -n '1,/^$/p'
      - run: npm run -s data:check -- DBY LIV | sed -n '1,/^$/p'
      - run: npm run -s data:check -- NOT BHM | sed -n '1,/^$/p'
      - run: npm run -s data:check -- KGX EDB | sed -n '1,/^$/p'
      - run: npm run -s data:check -- LGE SHF | sed -n '1,/^$/p'
      - run: npm run -s data:check -- NRW BHM | sed -n '1,/^$/p'
      - run: npm run -s data:check -- PBO BRI | sed -n '1,/^$/p'
      - run: npm run -s data:check -- CHD LGE | sed -n '1,/^$/p'
      - run: npm run -s data:check -- LGE MAN | grep -i -A40 'via' | head -60
